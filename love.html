<!DOCTYPE html>
<html>
<head>
    <title>Our Instagram Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.4;
            text-transform: none;
        }

        .link-box {
            background-color: #fff;
            border: 2px solid #ddd;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .link-box:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .link-box a {
            text-decoration: none;
            color: #fff;
            background-color: #e4405f;
            padding: 12px 20px;
            border-radius: 5px;
            display: inline-block;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .link-box a:hover {
            background-color: #c32f4b;
        }
    </style>
</head>
<body>

    <!-- Longer, centered heading -->
    <h1>Explore the Beautiful Moments of My Sweetheart,  Her Instagram is Full of Love and Smiles!</h1>

    <div class="link-box">
        <p>Check out my Sweetheart's account</p> <a href="https://www.instagram.com/adee_linna0210?igsh=N2ZyZmFpY3RweDZw" target="_blank">Her Insta </a>
    </div>

    <div class="link-box">
        <p>Check out my Sweetheart's another account!</p>
        <a href="https://www.instagram.com/itz_adelle94?igsh=MWFsMjV1dDJmZTh1Yw==" target="_blank">Her Insta</a>
    </div>

</body>
</html>
